<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador Interactivo de Dijkstra</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none">
    
    <!-- Encabezado Principal -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between z-10">
      <h1 class="text-lg font-bold tracking-wide text-indigo-400">Dijkstra Algorithm Visualizer</h1>
      
      <!-- Controles de Modo / Estado -->
      <div class="flex items-center gap-4">
        <span id="status-indicator" class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">
          Modo Edición
        </span>
        <button id="btn-execute" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-1.5 rounded-lg font-medium transition cursor-pointer">
          Calcular Ruta
        </button>
      </div>
    </header>

    <!-- Contenedor Principal (Canvas + Paneles) -->
    <main class="flex-1 relative w-full h-full">
      
      <!-- Lienzo SVG para D3 -->
      <svg id="graph-canvas" class="w-full h-full cursor-crosshair bg-slate-950"></svg>

      <!-- Panel Flotante Izquierdo: Marcadores de Inicio y Meta (Draggable Identifiers) -->
      <aside class="absolute top-6 left-6 w-64 bg-slate-900/90 border border-slate-800 rounded-xl p-4 backdrop-blur shadow-2xl z-10 flex flex-col gap-4">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Puntos de Control</h2>
          <p class="text-xs text-slate-500">Arrastra los marcadores hacia un nodo del lienzo.</p>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Marcador Inicio -->
          <div id="drag-start" draggable="true" class="flex items-center gap-3 p-2.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-300 text-xs font-semibold cursor-grab active:cursor-grabbing hover:bg-amber-500/20 transition">
            <span class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.8)]"></span>
            <span>Nodo Inicio</span>
          </div>

          <!-- Marcador Meta -->
          <div id="drag-target" draggable="true" class="flex items-center gap-3 p-2.5 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-xs font-semibold cursor-grab active:cursor-grabbing hover:bg-emerald-500/20 transition">
            <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
            <span>Nodo Meta</span>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-3 text-xs text-slate-400 flex flex-col gap-1">
          <div><span class="font-bold text-slate-300">Doble Clic:</span> Crear nodo</div>
          <div><span class="font-bold text-slate-300">Arrastrar:</span> Conectar nodos / mover</div>
        </div>
      </aside>

      <!-- Panel Flotante Inferior: Controles de Reproducción y Animación -->
      <div id="playback-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-slate-800 rounded-xl px-6 py-3 backdrop-blur shadow-2xl z-10 flex items-center gap-6">
        <button id="btn-prev" class="text-slate-400 hover:text-white transition disabled:opacity-30">Paso Anterior</button>
        <button id="btn-play" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition">Reproducir</button>
        <button id="btn-next" class="text-slate-400 hover:text-white transition disabled:opacity-30">Paso Siguiente</button>
        
        <div class="h-4 w-px bg-slate-800"></div>

        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span>Velocidad:</span>
          <input id="speed-range" type="range" min="100" max="1500" value="500" class="accent-indigo-500 w-24 cursor-pointer" />
        </div>
      </div>

    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
