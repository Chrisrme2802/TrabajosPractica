<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trabajo-graficacion-forma-espiral</title>
</head>
<body class="h-screen w-screen relative select-none overflow-hidden bg-slate-950 text-slate-100">

  <div id="canvas-container" class="w-full h-full absolute inset-0 cursor-pointer"></div>

  <header class="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-4 py-3 rounded-xl flex items-center gap-3 shadow-2xl">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow-lg shadow-indigo-500/30">
      ⚡
    </div>
    <div>
      <h1 class="text-sm font-bold tracking-wide text-white">Trabajo Forma Espiral</h1>
      <p class="text-xs text-slate-400">Graficacion Pixi.js Vite Tailwind CSS</p>
    </div>
  </header>

  <aside id="control-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-4 flex flex-wrap items-center gap-5 shadow-2xl">
    
    <!-- Selección de Formas -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium text-slate-300">Forma:</span>
      <div class="flex gap-1 p-1 bg-slate-950/60 rounded-xl border border-slate-800">
        <button data-shape="square" class="shape-btn px-3 py-1 text-xs rounded-lg font-medium bg-indigo-600 text-white transition-all shadow-sm">Cuadrado</button>
        <button data-shape="triangle" class="shape-btn px-3 py-1 text-xs rounded-lg font-medium text-slate-400 hover:text-white transition-all">Triángulo</button>
        <button data-shape="octagon" class="shape-btn px-3 py-1 text-xs rounded-lg font-medium text-slate-400 hover:text-white transition-all">Octágono</button>
        <button data-shape="circle" class="shape-btn px-3 py-1 text-xs rounded-lg font-medium text-slate-400 hover:text-white transition-all">Círculo</button>
      </div>
    </div>

    <!-- Slider de Capas -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium text-slate-300">Capas:</span>
      <input type="range" id="density-slider" min="20" max="200" step="5" value="100" class="w-24 accent-indigo-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
      <span id="density-val" class="text-xs font-mono text-indigo-400 w-6">100</span>
    </div>

    <!-- Slider de Velocidad de Rotación -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium text-slate-300">Velocidad:</span>
      <input type="range" id="speed-slider" min="-3" max="3" step="0.1" value="1" class="w-24 accent-indigo-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
      <span id="speed-val" class="text-xs font-mono text-indigo-400 w-8">1.0x</span>
    </div>

    <!-- Controles de Borde / Stroke -->
    <div class="flex items-center gap-2">
      <button id="stroke-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center gap-1.5">
        Borde: Off
      </button>
      <input type="color" id="stroke-color-picker" value="#ffffff" class="w-6 h-6 rounded border-0 bg-transparent cursor-pointer disabled:opacity-30" disabled title="Color del borde">
    </div>

    <!-- Botón de Cambio de Color Interior -->
    <button id="randomize-btn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition-all shadow-md active:scale-95 flex items-center gap-1.5">
      Cambiar Color
    </button>
  </aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
